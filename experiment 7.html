<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            color: rgb(108, 232, 230);
        }
        nav{
            height: 80px;
            width: 100%;
            background-color: rgb(2, 2, 36);
        }
        ul{
            list-style-type: none;
            line-height: 80px;

        }
        li{
            display: inline;
            border-right:2px bold rgb(178, 201, 131);
        }
        a{
            padding: 5px;
            font-size: large;
            padding-right: 80px;
        }
        a:hover{
            color:rgb(162, 99, 21);
            border-bottom: 2px bold rgb(84, 16, 16);
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li><a href="#">home</a></li>
            <li><a href="#">Admission</a>
            <li><a href="#">Academics</a></li>
            <li><a href="#"> Placement </a></li>
            <li><a href="#"> Club</a></li>
            <li><a href="#"> Campus life </a></li>
        </ul>
    </nav>
</body>    
    

</html>
